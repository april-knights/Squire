name: Composer Fix Lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Show composer version
        run: composer --version

      - name: Validate composer files (optional)
        run: composer validate --no-check-all --no-interaction

      - name: Update only the Reddit provider and dependencies
        run: composer update socialiteproviders/reddit --with-all-dependencies --no-interaction

      - name: Commit composer.lock if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Update composer.lock for socialiteproviders/reddit"
          git push
